# Motion Specification — Unused Tickets
# Format: docs/motion-spec.md (ADR 0016). Language: English (ADR 0002).
# Sources: brief.md (team, RU), storyboard.md, ADR 0036 (scenario, roles), motion/principles.md (ADR 0006).
# Status: values approved by the team 2026-10-14 (all by recommendation); to be tuned on the stand and reviewed by the team.

animation: unused-tickets
story: >
  An unused ticket turns into money. Quiet streams run through the background, the ticket and the wallet hover a little each at its own pace,
  and banknotes travel from under the ticket into the wallet one after another in one gentle, accelerating motion; the wallet springs on every arrival.

layers:                       # roles from figma.json; animate nothing else
  impulse: 9                  # horizontal bars on short dotted lines (run); the vertical streak stays as drawn
  card: 1                     # the ticket (library instance) hovers as a whole; its shadow child (role shadow) stays still
  shadow: 1                   # the ticket's big drop shadow
  bill: 2                     # banknotes, behind the ticket and the wallet; the lower one comes first in the file
  wallet: 1                   # hovers and springs

tempo:                        # illustration-specific values (ADR 0036)
  cardAmp: 1.5                # px, the ticket goes this far up and down
  cardTilt: 0.15              # degrees
  cardPeriod: 4s              # one full up-down-up cycle (sine)
  walletAmp: 1                # px
  walletTilt: 0.1             # degrees
  walletPeriod: 3.4s          # different from the ticket: they never move in step, and the wallet starts in the other direction
  round: 4s                   # one round (the notes are gone for about a second before the next ones start)
  start: 0.4s                 # the lower note starts its trip (leaves the shadow of the ticket)
  dur: 2.4s                   # one trip of one note, from under the ticket to behind the wallet, in one motion; both notes take the same time
  comeLowerPx: 75             # px, how far under the ticket a note waits before the trip (lower)
  comeUpperPx: 39             # px (upper)
  goLowerPx: 42               # px, how far a note sinks after the design position: until it is hidden behind the wallet
  goUpperPx: 76               # derived, not tempo values: the upper note starts later by the time that puts both notes in the design position at the same moment,
                              # and the animation starts at that moment (first frame = design, principles §3)
  bumpScale: 1.03             # wallet swells to this when a note has disappeared into it
  bumpDur: 0.3s
  bumpLead: 0.1s              # the swell starts this much before the note is hidden
  ambientSpeed: 36            # px/s, background bars (as in Client Interaction)
  ambientGapMin: 0.6s         # pause before a background bar returns, different on every line
  ambientGapMax: 1.8s

ease:
  trip: sine.in               # token motion.ease.exit: gentle start, then faster; no stop on the way (team 2026-10-14)
  bump: sine                #  half a sine wave (up and back)
  levitate: sine.inOut        # sin(2πt/period) is the same curve played back and forth

trigger:
  when: card-active           # the card becomes active by scrolling to it or by a click in the sidebar
  threshold: motion.trigger.threshold   # token: 35 % of the illustration visible
  delay: motion.trigger.delay           # token: 0
  replay: on-every-activation           # principles §5

loop:
  mode: infinite
  basis: ADR 0007             # meaningful-loop exception to principles §6
  pauseWhen: [off-screen, card-inactive]

staticState: design           # first frame, reduced motion and any error show the Figma design as is
